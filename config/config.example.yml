project:
  genome_build: GRCh37
  ancestry: EUR
  output_dir: results
  seed: 100

traits:
  ra:
    label: Rheumatoid arthritis
    file: data/processed/ra.tsv.gz
    n_case: 22350
    n_control: 74823
    prevalence: null
  mg:
    label: Myasthenia gravis
    file: data/processed/mg.tsv.gz
    n_case: 5708
    n_control: 432028
    prevalence: null

references:
  hm3_snplist: reference/w_hm3.snplist
  ldsc_eur_prefix: reference/eur_w_ld_chr/
  ldsc_baseline_prefix: reference/1000G_EUR_Phase3_baseline/baseline.
  ldsc_weights_prefix: reference/weights_hm3_no_hla/weights.
  ldsc_cts_file: reference/Multi_tissue_gene_expr.ldcts
  gnova_bfile_pattern: reference/gnova/eur_chr@_SNPmaf5
  hess_bfile_pattern: reference/hess/1kg_eur_1pct_chr@
  hess_partition_pattern: reference/hess/EUR/fourier_ls-chr@.bed
  gwas_pw_blocks: reference/ldetect/EUR/fourier_ls-all.bed
  plink_eur_prefix: reference/1000G/EUR
  cpassoc_pruned_snps: config/cpassoc_pruned_snps.txt
  mixer_bim_pattern: reference/mixer/1000G.EUR.QC.@.bim
  mixer_ld_pattern: reference/mixer/1000G.EUR.QC.@.run4.ld
  mixer_extract_pattern: reference/mixer/1000G.EUR.QC.prune_maf0p05_rand2M_r2p8.rep{rep}.snps
  fusion_ld_prefix: reference/fusion/1000G.EUR.
  smr_bfile_prefix: reference/smr/all_phase3_maf005

tools:
  python2: python2.7
  python3: python3
  plink: plink
  ldsc_dir: external/ldsc
  gnova_script: external/GNOVA/gnova.py
  hess_script: external/hess/hess.py
  gwas_pw_binary: external/gwas-pw/src/gwas-pw
  mixer_script: external/mixer/precimed/mixer.py
  mixer_figures: external/mixer/precimed/mixer_figures.py
  mixer_library: external/mixer/src/build/lib/libbgmg.so
  mtag_script: external/mtag/mtag.py
  cpassoc_functions: external/CPASSOC/FunctionSet.R
  fusion_script: external/fusion_twas/FUSION.assoc_test.R
  smr_binary: smr

parameters:
  qc:
    maf_min: 0.01
    info_min: 0.90
  hess:
    phenotypic_correlation: 0.0
    number_shared_samples: 0
  mixer:
    replicates: 20
    exclude_range: "chr6:26-34MB"
  mr:
    p_threshold: 5.0e-8
    clump_r2: 0.001
    clump_kb: 10000
    f_min: 10
    harmonise_action: 2
    presso_distributions: 10000
  cause:
    p_threshold: 1.0e-3
    clump_r2: 0.01
    clump_kb: 10000
    force: false
  magma:
    upstream_kb: 35
    downstream_kb: 10
    run_linear: true
    run_top10: true
  mtag:
    maf_min: 0.01
    n_min_fraction_of_p90: 0.75
  cpassoc:
    folds: 20
    gamma_simulations: 10000
    significance: 5.0e-8
    single_trait_p: 1.0e-3
  coloc:
    window_bp: 250000
    pp_h4_threshold: 0.80
    p1: 1.0e-4
    p2: 1.0e-4
    p12: 1.0e-5
  scrna:
    variable_features: 2000
    clustering_resolution: 0.5
    candidate_genes: [GSDMB, ORMDL3, IKZF3, RNASET2]

single_cell:
  ra:
    input_dir: data/raw/scrna/ra
    sample_names: [uRA1, uRA2, uRA3, uRA4]
    gene_column: 2
    min_features: 200
    max_features: 2500
    max_percent_mt: 5
    dims: 10
    annotation_file: config/ra_cluster_annotations.example.tsv
  mg:
    input_dir: data/raw/scrna/mg
    file_pattern: "^GSM.*\\.txt$"
    disease_pattern: "_A"
    control_pattern: "_H"
    min_features: 500
    max_features: 6000
    max_percent_mt: 15
    dims: 15
    annotation_file: config/mg_cluster_annotations.example.tsv

expression:
  ctd_rds: data/processed/cell_type_data.rds
  fusion_manifest: config/fusion_weights.tsv
  smr_manifest: config/smr_eqtl.tsv
