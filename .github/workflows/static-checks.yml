name: static-checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
      - name: Install YAML parser
        run: Rscript -e 'install.packages("yaml", repos="https://cloud.r-project.org")'
      - name: Run repository checks
        run: bash tests/static_checks.sh
